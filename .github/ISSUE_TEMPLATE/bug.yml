name: Bug report
description: The tool crashed, produced malformed output, or behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a *control* reported the wrong verdict, use the "wrong thing"
        template instead — it asks for different information.

        If this is a security issue, do not open an issue. See
        [SECURITY.md](https://github.com/scm-bench/jenkins-bench/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The exact command, with the token and hostname removed. If it
        reproduces against the bundled sample
        (`--snapshot-in examples/snapshot.json`), say so — that makes it
        trivial for us to confirm.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        Add `--verbose` if the failure is during a scan. **Check for
        credentials before pasting** — if a token ever appears here, that is
        itself a security bug and we want to know.
      render: shell

  - type: input
    id: version
    attributes:
      label: jenkins-bench version
      description: Output of `jenkins-bench version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64 / ghcr image
