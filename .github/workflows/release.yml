# Template. Copy to .github/workflows/release.yml in a bench repository and
# replace jenkins-bench with the binary name. The action SHAs below are pinned on
# purpose — update them deliberately, do not loosen them to tags. See
# ../README.md.
name: Release

on:
  # Normal path: someone pushes a tag from a checkout.
  push:
    tags: ["v*"]
  # Manual path: cut a release from the GitHub UI or API, with no local
  # checkout involved. The tag is created by this workflow rather than
  # beforehand, so releasing does not require a machine with push access.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # id-token backs cosign's keyless signing: the workflow's OIDC token becomes
  # the signing identity, so there is no private key to store or rotate.
  id-token: write
  # attestations lets the run record SLSA build provenance for the archives.
  attestations: write

# Two releases must never run at once: both would try to create the tag, and
# whichever lost the race would already have started publishing. In-progress
# runs are never cancelled — killing a release halfway through leaves images
# pushed with no release to match them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before releasing
        run: go test ./... -count=1

      # Created after the tests, so a failing commit never gets tagged. Pushing
      # with GITHUB_TOKEN does not start another workflow run, so this does not
      # re-trigger the push event above.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # Passed through the environment rather than interpolated into the
          # script, so the input cannot inject shell.
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Go ignores a tag that is not canonical semver, which makes the
          # release uninstallable while every build step still reports success.
          # Reject it here instead of finding out from a user.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a canonical semver tag. Use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix (v0.1.0, v0.1.0-rc.1)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; releases are immutable, pick a new version"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "jenkins-bench $TAG"
          git push origin "$TAG"
          echo "created $TAG at $(git rev-parse --short HEAD)"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0

      # goreleaser shells out to cosign for `signs` and `docker_signs`, so it
      # has to be on PATH before the release runs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance answers a different question than the signature does. The
      # cosign signature says this release came from this workflow; the
      # attestation records what it was built from — commit, workflow, runner —
      # in a form `gh attestation verify` checks without any of it having to be
      # taken on trust from the release notes.
      #
      # It runs after goreleaser because it attests the files goreleaser
      # produced. A failure here leaves a published release without provenance
      # rather than no release at all, which is the right way round: the
      # artifacts are already uploaded and their checksums already signed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
