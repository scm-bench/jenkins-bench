# jenkins-bench configuration.
#
# Every field is optional: what you leave out keeps its default, so this file
# only needs to state what you want changed. scan finds it on its own as
# jenkins-bench.yaml (or .jenkins-bench.yaml) in the working directory, or
# config.yaml in the user config directory; --config names it explicitly. A
# single run can override any key without touching the file:
# --set scan.failOn=none.
#
# Sequences are the one exception — YAML replaces a list wholesale rather than
# merging it, so setting `exclude` replaces the whole list.

# Settings that describe the deployment rather than any one run. No policy reads
# this section, which is what keeps input.config identical between two runs that
# differ only in how they were driven.
scan:
  # Exit-code thresholds: the severity that fails the run, the minimum
  # acceptable score (0 disables), and the percentage of controls allowed to go
  # unevaluated before the scan cannot be trusted (-1 disables).
  #
  # maxManual is the one worth setting on Jenkins. Controls that could not be
  # evaluated are excluded from the score rather than counted against it, so a
  # token that can read very little produces a high score from a small sample —
  # and a token without Job/ExtendedRead cannot answer a single job-scope
  # control. A ceiling here is what turns that into a failure rather than a
  # clean report. Only automated controls count against it: the bundle also
  # ships controls that are manual by design, and no token makes those go away.
  failOn: high
  failUnder: 0
  maxManual: -1

  # Transport and pace: parallel job fetches, per-request timeout, and a
  # whole-scan deadline (0s means none). Each job costs two requests, so
  # concurrency is what a controller with a thousand jobs notices.
  concurrency: 8
  timeout: 30s
  maxDuration: 0s

  # How much the scan says on stderr while it runs: full prints every request
  # (as -v does, which overrides this), compact one self-overwriting line on a
  # terminal, off nothing. The closing account of what was sent — "✓ N requests
  # · N GET · 0 writes · read-only" — is printed whatever this says.
  progress: compact

  # A controller whose certificate comes from an internal CA: name a PEM bundle
  # holding that CA, trusted in addition to the system's. This is the setting
  # an enterprise controller needs — not insecure, which stops checking who
  # answered at all. A proxy is taken from HTTPS_PROXY and NO_PROXY.
  #caFile: /etc/ssl/certs/corp-root-ca.pem

  # Weakening transport security is a decision written into a file someone can
  # review, not a habit of the fingers. allowPlaintext is not needed for
  # localhost, which is already permitted.
  insecure: false
  allowPlaintext: false

  # Accept a scan in which some folder could not be listed. Its jobs are absent
  # from the report rather than judged, so by default such a scan exits 2 — the
  # report is still written, and the warnings name every folder that was
  # missed. Set this only for a folder the scanning account is meant not to see.
  allowIncomplete: false

# The numeric knobs the policies read, handed to Rego verbatim as input.config
# so that no control hard-codes a number.
thresholds:
  # How stale the controller's cached update-centre data may be before a
  # control about plugin currency stops trusting it.
  #
  # hasUpdate is computed against that cache. A controller that has never
  # reached updates.jenkins.io — air-gapped, or behind a proxy that never
  # worked — reports hasUpdate false for every plugin, and a control reading it
  # would report PASS on an instance that has no idea whether it is out of date.
  # Past this age the answer is MANUAL.
  updateSiteMaxAgeDays: 30

# Plugin shortNames that satisfy the build-environment logging control
# (CIS-2.1.3). Jenkins has no built-in audit log, so which plugin counts is
# deployment-specific: audit-trail records who did what, and the shippers
# forward activity to a central store. Matched exactly, not as substrings —
# and remember YAML replaces a list wholesale, so restate the defaults you
# want to keep when adding your own.
auditPluginNames:
  - audit-trail
  - audit-log
  - logstash
  - splunk-devops
  - datadog
  - opentelemetry

# Drop disabled jobs from the scan entirely, rather than reporting NA for each.
# Off by default: a disabled job is still configuration somebody can re-enable,
# and a report that silently omits them describes a smaller controller than the
# one that exists.
skipDisabledJobs: false

# Exceptions: findings your organisation has decided to live with, for a
# stated reason and until a stated date. Every field but owner is required —
# an exception without a reason or an end date is how accepted risk becomes
# forgotten risk.
#
# An accepted finding is still reported (under "Accepted by exceptions"),
# still FAIL, and still counted in the score: the score describes the
# controller, and accepting a finding does not change the controller. What it
# stops doing is failing the run on scan.failOn — or, for a MANUAL finding,
# counting against scan.maxManual. In SARIF it carries a suppression, which
# code scanning shows as dismissed.
#
# The day after expires, it lapses and the finding fails the run again; an
# exception that matches nothing is reported too, so the list cannot rot
# quietly. resources are globs over job full names: * does not cross a "/",
# so platform/* is every job directly in the platform folder, and
# "controller" is a controller-scope control.
#
# exceptions:
#   - control: CIS-2.3.5
#     resources: [platform/legacy-*]
#     reason: Vendor job, replaced in Q1
#     owner: platform-team@example.com
#     expires: 2027-03-31

# Controls to leave out, or the only ones to run. A name that matches no control
# is an error rather than a no-op: an exclude that matches nothing leaves the
# control running, and an include that matches nothing narrows the scan to
# nothing. Both look like a successful scan.
exclude: []
include: []
